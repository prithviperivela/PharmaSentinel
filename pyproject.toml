[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmasentinel"
version = "0.1.0"
description = "Evidence-grounded pharmacovigilance extraction and review analytics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "scikit-learn>=1.5", "torch>=2.4", "transformers>=4.45,<6", "plotly>=5.24"]

[project.optional-dependencies]
viewer = ["streamlit>=1.40"]
figures = ["matplotlib>=3.8"]
mysql = ["mysql-connector-python>=9"]
dev = ["pytest>=8"]

[project.scripts]
pharmasentinel = "pharmasentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

